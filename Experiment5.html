<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 5</title>
</head>
<body>
    <form>
    <fieldset>
        <h1 align="center">Student Registration Form</h1>
        <hr>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name">

        <br> </br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">

        <br> </br>
        <label for="pass">Password:</label>
        <input type="pass" id="pass" name="pass" placeholder="EnterPassword">
        <br> </br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        

        <br> </br>
        <label for="lang">Course:</label>
        <select id="lang" name="lang">
            <option value="">Select Course</option>
            <option value="">B.Tech</option>
            <option value="">M.Tech</option>
            <option value="">MBA</option>
            <option value="">MCA</option>
            <option value="">PhD</option>
            </select>



        <br> </br>
      <label for="tel">Phone:</label>
      <input type="tel" name="trl" id="tel" placeholder="Enter phone number">


        <br> </br>
        <label for="address">Enter Your Address:</label>
        <input type="address" 
        id="address" name="address" placeholder="Enter your Address">

        <br> </br>
        <input type="Submit" value="Register">
        <input type="reset" value="clear">
        <hr>

        <p align="center">&copy; 2025 Student Registration Portal</p>
    </fieldset>
    </form>
</body>
</html>
